---
name: Release
permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    uses: ./.github/workflows/windows-kiosk.yml
    with:
      version: ${{ github.ref_name }}

  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install create-dmg
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          version: 6.10.2
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@9edeb24ae65361fd032a063a0b0148764eff09c5'

      - name: Build and Package
        run: bash scripts/generate-dmg.sh Release
        env:
          CI_VERSION: ${{ steps.get_version.outputs.version }}

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v5
        with:
          name: HydraExperienceNet-macOS
          path: build/installer-Release/*.dmg
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Name Windows package and create checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mv release/HydraExperienceNet-Windows-x64.zip "release/HydraExperienceNet-${VERSION}-windows-x64.zip"
          cd release
          sha256sum *.dmg *.zip > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to release server
        env:
          HYDRARELEASE_TOKEN: ${{ secrets.HYDRARELEASE_PUBLISH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SERVER="https://releases.experiencenet.com"
          PROJECT="hydraexperiencenet"
          CHANNEL="production"

          for FILE in release/*; do
            NAME=$(basename "$FILE")
            echo "Uploading $NAME..."
            curl -fsS -X POST \
              -H "Authorization: Bearer $HYDRARELEASE_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE" \
              "$SERVER/api/v1/publish/$PROJECT/$CHANNEL/$VERSION/$NAME"
          done

          echo "Finalizing..."
          curl -sf -X POST \
            -H "Authorization: Bearer $HYDRARELEASE_TOKEN" \
            "$SERVER/api/v1/publish/$PROJECT/$CHANNEL/$VERSION/finalize"
