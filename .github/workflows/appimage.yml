name: Linux AppImage

# Builds the Linux AppImage for hydraheadflatscreen kiosk heads (omarchy)
# and publishes it to the release server next to the DMG, under the name
# the agent's QtAppUpdater expects:
#   HydraExperienceNet-v<X.Y.Z>-linux-x86_64.AppImage
#
# Triggers:
# - tags: every release gets a Linux artifact alongside the DMG
# - workflow_dispatch: backfill an existing release version without a new
#   tag (no macOS fleet impact)
# - a push touching this workflow file (first-run bootstrap)

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - '.github/workflows/appimage.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build and publish (bare SemVer, e.g. 6.1.37)'
        required: true
        default: '6.1.37'

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Bootstrap push: backfill the latest published release, not the
            # stale in-tree version.txt (CI normally overwrites that file).
            VERSION=$(curl -fsSL "https://releases.experiencenet.com/hydraexperiencenet/production/latest.json" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q \
            build-essential pkg-config cmake \
            libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev \
            libssl-dev libopus-dev \
            libfreetype-dev libharfbuzz-dev \
            libavcodec-dev libavutil-dev libswscale-dev \
            libva-dev libvdpau-dev libdrm-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev libudev-dev libdbus-1-dev \
            libfuse2

      # Distro SDL2 is unusable here: its SDL_syswm.h includes X11/Xlib.h,
      # whose macros (None, Type) break Qt headers in any file that includes
      # SDL before Qt (abstouch.cpp). Upstream builds SDL3 + sdl2-compat from
      # source, whose compat SDL_syswm.h has no X11 include; mirror that,
      # plus SDL_ttf against the compat SDL2.
      - name: Build SDL3, sdl2-compat, SDL_ttf from source
        run: |
          git clone --depth 1 --branch release-3.2.x https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=OFF
          cmake --build /tmp/SDL3/build -j$(nproc)
          sudo cmake --install /tmp/SDL3/build

          git clone --depth 1 --branch release-2.32.70 https://github.com/libsdl-org/sdl2-compat.git /tmp/sdl2-compat
          cmake -S /tmp/sdl2-compat -B /tmp/sdl2-compat/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/sdl2-compat/build -j$(nproc)
          sudo cmake --install /tmp/sdl2-compat/build

          git clone --depth 1 --branch release-2.24.x https://github.com/libsdl-org/SDL_ttf.git /tmp/SDL_ttf
          cmake -S /tmp/SDL_ttf -B /tmp/SDL_ttf/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/SDL_ttf/build -j$(nproc)
          sudo cmake --install /tmp/SDL_ttf/build

          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          version: '6.10.2'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@9edeb24ae65361fd032a063a0b0148764eff09c5'

      - name: Install linuxdeploy and its qt plugin
        run: |
          sudo curl -fsSL -o /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo curl -fsSL -o /usr/local/bin/linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-qt

      - name: Build AppImage
        env:
          CI_VERSION: ${{ steps.ver.outputs.version }}
          LINUXDEPLOYQT_EXTRA_ARGS: '-unsupported-allow-new-glibc -verbose=2'
        run: |
          echo "$CI_VERSION" > app/version.txt
          bash scripts/build-appimage.sh

      - name: Publish to release server
        env:
          HYDRARELEASE_TOKEN: ${{ secrets.HYDRARELEASE_PUBLISH_TOKEN }}
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          SERVER="https://releases.experiencenet.com"
          PROJECT="hydraexperiencenet"
          CHANNEL="production"
          NAME="HydraExperienceNet-v${VERSION}-linux-x86_64.AppImage"

          SRC=$(find build/installer-release -name '*.AppImage' | head -1)
          [ -n "$SRC" ] || { echo "no AppImage produced" >&2; exit 1; }
          cp "$SRC" "$NAME"
          ls -la "$NAME"

          curl -sf -X POST \
            -H "Authorization: Bearer $HYDRARELEASE_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$NAME" \
            "$SERVER/api/v1/publish/$PROJECT/$CHANNEL/v$VERSION/$NAME"

          curl -sf -X POST \
            -H "Authorization: Bearer $HYDRARELEASE_TOKEN" \
            "$SERVER/api/v1/publish/$PROJECT/$CHANNEL/v$VERSION/finalize"
          echo "published $NAME to $PROJECT/$CHANNEL/v$VERSION"
